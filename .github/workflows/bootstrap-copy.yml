name: Bootstrap V2 from current Brandon RV
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: bootstrap-brandon-rv-v2
  cancel-in-progress: false
jobs:
  copy-current-project:
    if: github.repository == 'remipetrovich-design/BrandonRV-V2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out V2 repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy current application source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/remipetrovich-design/Brandon-RV-.git /tmp/brandon-rv-source
          rsync -a --delete --exclude='.git' /tmp/brandon-rv-source/ "$GITHUB_WORKSPACE/"
          rm -f "$GITHUB_WORKSPACE/.github/workflows/bootstrap-copy.yml"
          rm -f "$GITHUB_WORKSPACE/.github/workflows/supabase-migrations.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No files to copy."
            exit 0
          fi
          git commit -m "Copy current Brandon RV application into V2"
          git push origin HEAD:main
