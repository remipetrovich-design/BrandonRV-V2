name: Manual V2 deploy with database migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type YES to confirm a production deployment and V2 database migration."
        required: true
        default: "NO"
        type: string

permissions:
  contents: read

jobs:
  deploy:
    # Second activation gate: this workflow remains inert until the repository
    # variable is explicitly changed to true and the caller confirms.
    if: vars.BRANDON_RV_MANUAL_DEPLOY_ENABLED == 'true' && inputs.confirm == 'YES'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_PROJECT_ID: lciylmfpcefdpsouoqvm
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out the production branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment configuration before changing the database
        shell: bash
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_ID" = "lciylmfpcefdpsouoqvm"
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required GitHub Actions secret $name is not configured."
              exit 1
            fi
          done

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build the production application before database changes
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Link only the Brandon RV V2 Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview pending database migrations
        run: supabase db push --linked --dry-run

      - name: Apply pending database migrations
        run: supabase db push --linked

      - name: Deploy the verified build to Vercel Production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
