name: Manual V2 deploy with database migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type YES to confirm a production deployment and V2 database migration."
        required: true
        default: "NO"
        type: string

permissions:
  contents: read

jobs:
  deploy:
    # This workflow stays inert until both activation gates are deliberately enabled.
    if: vars.BRANDON_RV_MANUAL_DEPLOY_ENABLED == 'true' && inputs.confirm == 'YES'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_PROJECT_ID: lciylmfpcefdpsouoqvm
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out the production branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Validate V2 Vercel deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_ID" = "lciylmfpcefdpsouoqvm"
          test "$VERCEL_ORG_ID" = "team_096KfEXGur0lYlViGQdIVEoU"
          test "$VERCEL_PROJECT_ID" = "prj_ZI2MbFrpCJFovX9unahbN5WgLqTw"
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required GitHub Actions secret $name is not configured."
              exit 1
            fi
          done

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Production project configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Pull Vercel-integrated Supabase Production environment
        run: vercel env pull .env.production.local --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Preview V2 database migration plan
        run: node scripts/run-supabase-migrations.mjs preview

      - name: Build the production application before database changes
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Apply V2 database migrations through the Vercel Supabase integration
        run: node scripts/run-supabase-migrations.mjs apply

      - name: Deploy the verified build to Vercel Production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
