name: Package Mail System Integration

on:
  push:
    paths:
      - ".github/workflows/package-mail-system.yml"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create ZIP with integration folder at archive root
        run: zip -r Mail-system.zip intergrations/Mail-system
      - name: Commit ZIP archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Mail-system.zip
          git commit -m "Add Mail-system integration ZIP"
          git push
