name: Manual V2 migration scan and apply

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type YES to scan and apply pending migrations to the dedicated V2 database."
        required: true
        default: "NO"
        type: string

permissions:
  contents: read

concurrency:
  group: brandon-rv-v2-manual-migrations
  cancel-in-progress: false

jobs:
  migrations:
    if: inputs.confirm == 'YES'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out the latest main migration history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh main and select its latest commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          git checkout --detach origin/main
          echo "Migration source commit: $(git rev-parse HEAD)"
          echo "Migration files in this commit: $(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)"

      - name: Validate dedicated V2 Supabase target
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SUPABASE_PROJECT_ID" != "lciylmfpcefdpsouoqvm" ]; then
            echo "::error::SUPABASE_PROJECT_ID secret must be lciylmfpcefdpsouoqvm."
            exit 1
          fi
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required GitHub Actions secret $name is not configured."
              exit 1
            fi
          done

      - name: Check migration filenames and references
        run: node scripts/check-migrations.mjs

      - name: Install project dependencies
        run: npm install --no-package-lock

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Scan remote migration history and preview pending changes
        run: node scripts/run-supabase-migrations.mjs preview

      - name: Apply pending migrations to dedicated V2 Supabase
        run: node scripts/run-supabase-migrations.mjs apply
