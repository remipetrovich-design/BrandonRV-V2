name: Brandon RV branch verification

on:
  push:
    branches:
      - design/public-site-customer-portal
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brandonrv-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ''

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript checks
        run: npm run typecheck

      - name: Automated tests
        run: npm test

      - name: Production build
        run: npm run build
